name: opencode-autofix

on:
  issues:
    types: [opened]

jobs:
  autofix:
    if: contains(github.event.issue.body, 'Sentry') || contains(github.event.issue.title, 'Error') || contains(github.event.issue.title, 'Exception')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          model: google/gemini-2.5-flash
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            This issue was reported from Sentry error monitoring.
            Analyze the error described in this issue, find the root cause in the codebase,
            implement a fix, and open a pull request with the changes.
            If the issue lacks details, look at recent Sentry errors or check the codebase
            for related issues.
