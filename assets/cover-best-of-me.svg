<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e"/>
      <stop offset="50%" stop-color="#0c1630"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="neon-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff7e40"/>
    </linearGradient>
    <radialGradient id="glow-core-1" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070c1e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-filter-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="url(#bg-grad-1)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow-core-1)"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="rgba(79, 172, 254, 0.08)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="0" y1="40" x2="400" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>

  <!-- Outer Ring with Tech Ticks -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="rgba(79, 172, 254, 0.25)" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="200" cy="180" r="126" fill="none" stroke="rgba(255, 126, 64, 0.3)" stroke-width="2" stroke-dasharray="16 32"/>

  <!-- Energy Hexagon / Shield -->
  <polygon points="200,90 275,135 275,225 200,270 125,225 125,135" fill="rgba(6, 17, 39, 0.7)" stroke="url(#neon-grad-1)" stroke-width="3" filter="url(#glow-filter-1)"/>

  <!-- Dynamic Sonic Waves Inside -->
  <path d="M145 180 Q 160 140, 175 180 T 205 180 T 235 180 T 255 180" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-filter-1)"/>
  <path d="M150 180 Q 170 215, 190 180 T 225 180 T 250 180" fill="none" stroke="#ff7e40" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Center Monogram / Crest -->
  <circle cx="200" cy="180" r="24" fill="#040914" stroke="#00f2fe" stroke-width="2"/>
  <path d="M192 170 L212 180 L192 190 Z" fill="#00f2fe"/>

  <!-- Top Badge -->
  <rect x="135" y="32" width="130" height="22" rx="11" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1"/>
  <text x="200" y="47" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="3">NEFFEX AUDIO</text>

  <!-- Title & Artist -->
  <text x="200" y="325" font-family="'Syne', 'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#edf4ff" text-anchor="middle" letter-spacing="2">BEST OF ME</text>
  <text x="200" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff9d45" text-anchor="middle" letter-spacing="4">NEFFEX</text>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="398" height="398" rx="19" fill="none" stroke="rgba(109, 146, 219, 0.3)" stroke-width="1.5"/>
</svg>
